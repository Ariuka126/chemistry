<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AS Chemistry Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cambridge International AS Level Chemistry (9701) tutor: IGCSE bridges, live models, worked examples, practice with hints, quick reference sheets and your own notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="katex.css">
<style>
/* Layout: a calm study desk on warm lab-notebook paper. One quiet top bar; pages are left-aligned on cool paper.
   The one loud thing is the set of hand-drawn unit stickers, tinted by strand. Unit pages: live model left (sticky), lesson right; one column on phones. */
:root{
  --bg:#f5f2ea; --panel:#fffdf8; --panel-2:#f3efe4; --panel-3:#e7e1d2; --line:#ddd5c3; --fg:#26231d; --muted:#6c6556;
  --accent:#137f78; --accent-2:#1a9c93; --accent-ink:#ffffff; --accent-soft:#dcf0ec;
  --good:#2b8a4e; --bad:#c9443d; --warn:#b97510;
  --phys:#3d6fd9; --inorg:#d9772b; --org:#3a9a4f; --prac:#9b5bd6;
  --c1:#3d6fd9; --c2:#d9772b; --c3:#c9443d; --c4:#7b57c9;
  --font-display:"Fredoka","Baloo 2",ui-rounded,system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16201f; --panel:#1d2928; --panel-2:#243332; --panel-3:#2e403e; --line:#36504d; --fg:#eef4f1; --muted:#a3b5b0;
  --accent:#4fd1c3; --accent-2:#7be0d5; --accent-ink:#10201e; --accent-soft:#1f4744;
  --good:#6bd68f; --bad:#ff8a80; --warn:#f2bb55;
  --phys:#7fa6ff; --inorg:#f5a45e; --org:#74d488; --prac:#c49cff;
  --c1:#7fa6ff; --c2:#f5a45e; --c3:#ff8a80; --c4:#b499ff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16201f; --panel:#1d2928; --panel-2:#243332; --panel-3:#2e403e; --line:#36504d; --fg:#eef4f1; --muted:#a3b5b0;
  --accent:#4fd1c3; --accent-2:#7be0d5; --accent-ink:#10201e; --accent-soft:#1f4744;
  --good:#6bd68f; --bad:#ff8a80; --warn:#f2bb55;
  --phys:#7fa6ff; --inorg:#f5a45e; --org:#74d488; --prac:#c49cff;
  --c1:#7fa6ff; --c2:#f5a45e; --c3:#ff8a80; --c4:#b499ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.katex{font-size:1.05em}
.katex-display{margin:.35em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:14px;color:var(--muted);font-weight:700}

/* ---- top bar ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.top-in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--font-display);font-weight:600;font-size:18px;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--panel)}
.nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
@media (max-width:640px){.brand span{display:none}.nav{flex:1}}

/* ---- page ---- */
.page{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;gap:24px}
.page>*,.panel>*,#simHost>*,#simHost>*>*,.sim-panel>*,.lab-main>*,.stage>*,.box>*,.lab>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px clamp(14px,2.6vw,26px);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.page-head h1{font-size:clamp(1.9rem,3.6vw,2.6rem)}
.lede{color:var(--muted);max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:9px 18px;cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000 45%);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000 45%)}
.btn.ghost{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--accent);filter:none}
.btn.ghost:active{transform:none}
.btn.sm{padding:6px 13px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:700}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);color:var(--fg);background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--panel-2);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tabs{display:flex;gap:4px;background:var(--panel-2);border-radius:99px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:transparent;border-radius:99px;padding:6px 15px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}

/* ---- stickers: the signature element ---- */
.sticker{--s:58px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;border-radius:30% 34% 32% 36%;background:color-mix(in srgb,var(--sc) 20%,var(--panel));color:color-mix(in srgb,var(--sc) 70%,var(--fg));box-shadow:0 3px 0 color-mix(in srgb,var(--sc) 45%,transparent);transform:rotate(var(--tilt,-3deg));position:relative}
.sticker svg{width:64%;height:64%;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sticker svg .f{fill:currentColor;stroke:none}
.sticker.big{--s:84px}
.sticker .star{position:absolute;right:-7px;top:-7px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;transform:rotate(8deg);box-shadow:0 2px 0 color-mix(in srgb,var(--good) 60%,#000 40%)}
.sticker .star svg{width:14px;height:14px;fill:#fff;stroke:none}

/* ---- home ---- */
.hello{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:end;padding-block:12px 4px}
@media (max-width:880px){.hello{grid-template-columns:minmax(0,1fr)}}
.hello h1{font-size:clamp(2.3rem,5.4vw,3.8rem);line-height:1.02;letter-spacing:-.015em}
.hello .lede{margin-top:12px;font-size:17px}
.resume{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.resume h2{font-size:1.35rem}
.resume .row{margin-top:10px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--panel-3)}
.dots i.on{background:var(--sc,var(--accent))}
.book-head{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:baseline}
.book-head h2{font-size:1.6rem}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:11px;height:11px;border-radius:4px;display:inline-block}
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1050px){.map{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.map{grid-template-columns:minmax(0,1fr)}}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;min-width:0}
.tile:hover{border-color:var(--sc)}
.tile:hover .sticker{transform:rotate(0deg) scale(1.04)}
.tile .sticker{transition:transform .15s}
.tile b{display:block;font-family:var(--font-display);font-weight:600;font-size:16.5px;line-height:1.2}
.tile .num{font-size:13px;color:var(--muted);font-weight:700}
.cards-nudge{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:15px}

/* ---- unit page ---- */
.unit-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px}
.unit-head .who{display:flex;align-items:center;gap:18px;min-width:0}
.unit-head h1{font-size:clamp(1.7rem,3.4vw,2.4rem)}
.unit-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1020px){.unit-grid{grid-template-columns:minmax(0,1fr)}}
.sim-panel{display:grid;gap:12px;padding:16px}
@media (min-width:1021px){.sim-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}}
.sim-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sim-head h3{font-size:1.1rem}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.ctl output{font-family:var(--font-mono);color:var(--fg);font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0;height:22px}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ro{background:var(--panel-2);border-radius:var(--r-sm);padding:7px 11px;min-width:0}
.ro dt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro dd{margin:0;font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:14.5px}
.sim-note{font-size:14.5px;color:var(--muted)}
.intents{font-size:15px}
.intents summary{cursor:pointer;color:var(--muted);font-weight:700}
.intents ul{margin:8px 0 0;padding-left:1.2em;display:grid;gap:3px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0;list-style:none;scrollbar-width:thin}
.steps button{display:flex;align-items:center;gap:7px;white-space:nowrap;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--panel);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:700}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:12px;color:var(--fg)}
.steps button[aria-current="step"]{box-shadow:inset 0 0 0 2px var(--accent);color:var(--fg)}
.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.steps button.done .n{background:var(--good);color:#fff}
.steps button:disabled{cursor:not-allowed;opacity:.45}
.lesson{display:grid;gap:14px;min-width:0}
.stage{display:grid;gap:14px}
.stage h2{font-size:1.55rem}
.stage p,.stage li{max-width:66ch}
.kicker{font-size:14px;color:var(--accent);font-weight:700}
.body{display:grid;gap:10px}
.body ul,.body ol{margin:0;padding-left:1.25em;display:grid;gap:4px}
.callout{background:var(--panel-2);border-radius:var(--r-md);padding:12px 16px;display:block}
.callout>*+*{margin-top:6px}
.callout.key{background:var(--accent-soft);color:var(--fg)}
.box{background:var(--panel-2);border-radius:var(--r-md);padding:16px;display:grid;gap:10px}
.box .tag{font-size:14px;font-weight:700;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--panel);border-radius:var(--r-md);padding:11px 14px;cursor:pointer;font-size:15.5px;line-height:1.45}
.opt:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--accent)}
.opt .l{font-size:13px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);font-weight:700}
.opt.right{box-shadow:inset 0 0 0 2px var(--good);background:color-mix(in srgb,var(--good) 10%,var(--panel))}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.opt.picked{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:var(--r-md);padding:11px 14px;font-size:15.5px}
.fb.good{background:color-mix(in srgb,var(--good) 13%,transparent)}
.fb.bad{background:color-mix(in srgb,var(--bad) 11%,transparent)}
.fb.info{background:var(--accent-soft)}
.fb.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.ans{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ans input[type=text]{width:140px;font-family:var(--font-mono);background:var(--panel);color:var(--fg);border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;padding:9px 12px}
.ans input[type=text]:focus{box-shadow:inset 0 0 0 2px var(--accent);outline:none}
.unit-lbl{font-family:var(--font-mono);color:var(--muted);font-size:14px}
.ladder{display:flex;gap:4px;align-items:center}
.ladder i{width:16px;height:6px;border-radius:99px;background:var(--panel-3)}
.ladder i.on{background:var(--warn)}
.sol{display:grid;gap:4px;background:var(--panel);border:1.5px dashed var(--line);border-radius:var(--r-md);padding:12px 16px}
.worked{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:w}
.worked>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:w}
.worked>li::before{content:counter(w);width:26px;height:26px;border-radius:50%;background:var(--panel-3);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.worked>li>div{min-width:0;display:grid;gap:6px}
.conf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.conf button{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:700}
.conf button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);color:var(--fg);background:var(--accent-soft)}
.nav-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gate-pred{display:flex;gap:8px;flex-wrap:wrap}
.gate-pred button{width:48px;height:48px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line);background:var(--panel);cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:19px}
.gate-pred button:hover{box-shadow:inset 0 0 0 2px var(--accent),0 3px 0 var(--accent)}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.def{background:var(--panel-2);border-radius:var(--r-md);padding:13px 16px;display:grid;gap:4px;min-width:0}
.def b{font-family:var(--font-display);font-weight:600;font-size:16px}
.def p{font-size:15px;color:var(--muted)}

/* ---- practice / cards ---- */
.qcard{display:grid;gap:12px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qtext{font-size:16.5px;max-width:70ch}
.flash{display:grid;gap:16px;justify-items:center;text-align:center;padding:34px 20px}
.flash .term{font-family:var(--font-display);font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:600}
.flash .defn{max-width:56ch;font-size:17px}
.boxes{display:flex;gap:6px;flex-wrap:wrap}
.boxes span{font-size:13px;background:var(--panel-2);border-radius:99px;padding:4px 10px;color:var(--muted);font-weight:700}

/* content tables inside lessons */
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th,.board td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.board th{font-size:14px;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--line)}
.chart .grid{stroke:var(--line);stroke-dasharray:2 4;opacity:.8}

/* ---- toast ---- */
.toasts{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 16px;font-size:15px;font-weight:700;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out;max-width:min(360px,calc(100vw - 28px))}
.toast small{font-weight:400;opacity:.8;display:block}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
footer.site{font-size:14px;color:var(--muted);max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---- chemistry additions ---- */
.sim-panel,.stage,.box,.lesson,#simHost,#simHost>div,.qcard,.body{grid-template-columns:minmax(0,1fr)}
.body>*,.callout>*{min-width:0;max-width:100%}
select{max-width:100%}
.ceq{white-space:normal}
.ceq .op{white-space:nowrap;padding:0 .3em}
.cef{font-family:var(--font-body)}
.eq{background:var(--panel-2);border-radius:var(--r-md);padding:10px 14px;overflow-x:auto;text-align:center}
.bridge{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:10px;align-items:stretch}
@media (max-width:560px){.bridge{grid-template-columns:minmax(0,1fr)}.bridge .arr{transform:rotate(90deg);justify-self:center}}
.bridge .col{border-radius:var(--r-md);padding:12px 15px;display:grid;gap:6px;align-content:start}
.bridge .igcse{background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.bridge .as{background:var(--accent-soft)}
.bridge .col b{font-family:var(--font-display);font-weight:600;font-size:15px}
.bridge ul{margin:0;padding-left:1.1em;display:grid;gap:3px;font-size:15px}
.bridge .arr{display:grid;place-items:center;color:var(--accent);font-size:26px;font-weight:700}
.trap{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-radius:var(--r-md);padding:11px 14px;font-size:15px}
.trap .ic{width:26px;height:26px;border-radius:9px;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.traps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.marks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.marks li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--panel);border-radius:var(--r-sm);padding:8px 12px;box-shadow:inset 0 0 0 1.5px var(--line)}
.marks input{width:18px;height:18px;margin-top:3px;accent-color:var(--good)}
textarea{font:inherit;color:var(--fg);background:var(--panel);border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:110px;resize:vertical}
textarea:focus,select:focus,input[type=search]:focus{box-shadow:inset 0 0 0 2px var(--accent);outline:none}
select,input[type=search]{background:var(--panel);border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;padding:8px 12px}
.svgwrap{background:var(--panel-2);border-radius:var(--r-md);overflow:hidden}
.svgwrap svg{display:block;width:100%;height:auto}
svg.sim text{font-family:var(--font-mono);font-size:12px;fill:var(--muted)}
svg.sim .lbl{fill:var(--fg);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ref-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.ref-card h3{font-size:1.15rem}
.ref-card .board td,.ref-card .board th{font-size:14.5px;padding:6px 8px}
.mine-list{display:grid;gap:10px}
.mine-item{background:var(--panel-2);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:6px}
.mine-item .row{justify-content:space-between}
.yours{border-left:4px solid var(--accent)}
.flask-fill{transition:fill .3s}
kbd{font-family:var(--font-mono);font-size:13px;background:var(--panel-2);border-radius:6px;padding:1px 6px;box-shadow:inset 0 0 0 1px var(--line)}
pre.fmt{font-family:var(--font-mono);font-size:13px;background:var(--panel-2);border-radius:var(--r-md);padding:12px 14px;overflow-x:auto;white-space:pre;margin:0}
</style>
</head>
